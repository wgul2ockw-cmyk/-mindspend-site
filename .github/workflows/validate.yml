name: Validate static site
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/site.py build
      - run: python3 scripts/render_home.py --check
      - run: python3 scripts/render_search_pages.py --check
      - run: node --test scripts/test-money-tools.cjs
      - run: node --check assets/money-tools.js
      - run: node --check assets/site-v2.js && node --check assets/mind.js
